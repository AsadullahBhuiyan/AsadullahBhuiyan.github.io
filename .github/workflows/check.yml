name: Check website
on:
  push:
    branches: [master, redesign]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
      - name: Build production site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Check links, metadata, and content
        run: python3 scripts/check_site.py _site --production
# Deliberately no deploy step or write permissions. GitHub Pages continues
# publishing only from master at the repository root, as configured in Settings.
